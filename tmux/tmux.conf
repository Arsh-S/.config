# Use Ctrl+S as prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Terminal capabilities
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Use terminal's default background
set -g window-style "bg=default"
set -g window-active-style "bg=default"

# Enable mouse support
set -g mouse on

# Allow scrollback
set -g history-limit 10000

# Use vi-style keys in copy mode
setw -g mode-keys vi

# Disable tmux touching system clipboard
set -g set-clipboard off

# Let Ghostty/macOS handle mouse selection outside copy-mode
unbind -T copy-mode-vi MouseDragEnd1Pane

# Bind y to copy selection to macOS clipboard using pbcopy
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Optional: other vi-style copy-mode keys
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi Enter send -X copy-selection

# Scroll with mouse in copy mode
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# Reload config with Ctrl+S r
unbind r
bind r source-file ~/.tmux.conf \; display-message "Reloaded tmux.conf"

# Vim-style pane navigation (LDUR)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Move status bar to bottom
set-option -g status-position bottom

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# set -g @plugin 'kanagawa/tmux'
#
# set -g @kanagawa-plugins "battery cpu-usage ram-usage mac-player mpc"

# set -g @plugin 'rose-pine/tmux'
# set -g @rose_pine_variant 'main'

set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-ignore-window-colors true
set -g @kanagawa-plugins "battery cpu-usage ram-usage"
set -g @kanagawa-show-powerline false
set -g @kanagawa-refresh-rate 1
set -g @kanagawa-show-empty-plugins false
set -g @kanagawa-battery-label false
set -g @kanagawa-show-battery-status true

set -g @kanagawa-cpu-usage-label " "
set -g @kanagawa-ram-usage-label " "

set -g @kanagawa-refresh-rate 1
set -g @kanagawa-show-left-icon smiley

# Semantic colors (recommended):
#   text, bg_bar, bg_pane, highlight, selection, info, accent, notice, error, muted, alert
# Legacy colors (still supported):
#   white, gray, dark_gray, light_purple, dark_purple, cyan, green, orange, red, pink, yellow
# set -g @kanagawa-[plugin-name]-colors "[background] [foreground]"
set -g @kanagawa-battery-colors "pink dark_gray"
set -g @kanagawa-cpu-usage-colors "orange dark_gray"
set -g @kanagawa-ram-usage-colors "cyan dark_gray"


set -g @kanagawa-battery-colors "gray white"
set -g @kanagawa-cpu-usage-colors "gray white"
set -g @kanagawa-ram-usage-colors "gray white"

# # Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)

# run '/Users/arsh/.tmux/plugins/tmux-kanagawa/kanagawa.tmux'
run -b '~/.tmux/plugins/tpm/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
