# Use Ctrl+S as prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Terminal capabilities
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -ga terminal-overrides ",xterm-ghostty:Tc"

# Use terminal's default background
set -g window-style "bg=default"
set -g window-active-style "bg=default"

# Enable mouse support
set -g mouse on

# Allow scrollback
set -g history-limit 10000

# Use vi-style keys in copy mode
setw -g mode-keys vi

# Disable tmux touching system clipboard
set -g set-clipboard off

# Prevent trackpad middle-click/3-finger tap from pasting the tmux buffer
unbind -T root MouseDown2Pane

# Let Ghostty/macOS handle mouse selection outside copy-mode
unbind -T copy-mode-vi MouseDragEnd1Pane

# Bind y to copy selection to macOS clipboard using pbcopy
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Optional: other vi-style copy-mode keys
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# Scroll with mouse in copy mode
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# Reload config with Ctrl+S r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

# Vim-style pane navigation (LDUR)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane splits should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# New windows should open to the same path as the current pane
bind c new-window -c "#{pane_current_path}"

# When using split-window without specifying vertical/horizontal
bind-key Enter split-window -c "#{pane_current_path}"

# New session with current path (useful when creating sessions from within tmux)
bind-key S new-session -c "#{pane_current_path}"

# Respawn pane/window in same directory
bind-key R respawn-pane -k -c "#{pane_current_path}"
bind-key W respawn-window -k -c "#{pane_current_path}"

# Quick window switching (Alt+number, no prefix needed)
unbind -n M-`
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Move status bar to bottom
set-option -g status-position bottom

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @ukiyo-theme 'dragon'
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-plugins "battery cpu-usage ram-usage time"
set -g @ukiyo-show-powerline false
set -g @ukiyo-refresh-rate 1
set -g @ukiyo-show-empty-plugins true
set -g @ukiyo-battery-label false
set -g @ukiyo-show-battery-status true

set -g @ukiyo-cpu-usage-label " "
set -g @ukiyo-ram-usage-label " "

set -g @ukiyo-refresh-rate 1
set -g @ukiyo-left-icon session

set -g @ukiyo-battery-colors "bg_bar text"
set -g @ukiyo-cpu-usage-colors "bg_bar text"
set -g @ukiyo-ram-usage-colors "bg_bar text"
set -g @ukiyo-time-colors "bg_bar text"

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_with_mouse off
set -g @yank_action 'copy-pipe'
set -g @continuum-restore 'on'
set -g @resurrect-save 'e'
set -g @resurrect-restore 'E'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
